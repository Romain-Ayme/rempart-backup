name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Publier ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que la version du tag correspond au plugin
        run: |
          tag="${GITHUB_REF_NAME#v}"
          header=$(grep -m1 -E '^ \* Version:' rempart-backup.php | sed -E 's/^ \* Version: *//' | tr -d '\r')
          stable=$(grep -m1 -E '^Stable tag:' readme.txt | sed -E 's/^Stable tag: *//' | tr -d '\r')
          echo "tag=$tag en-tête=$header readme=$stable"
          [ "$tag" = "$header" ] && [ "$tag" = "$stable" ]

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Construire le zip
        run: node tools/build-zip.js

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/rempart-backup.zip --title "$GITHUB_REF_NAME" --generate-notes
